]

[[scenario]]
id = "ambiguous-import"
code = "explore then goal (13 of 62 openers): a wish plus a request to look"
variant = "committed"
turns = [
  {text = "хочу импорт из goodreads, глянь как это лучше сделать", expect = "answer_plan", oracle = ["goodreads", "csv|json|export|экспорт|api"]},
