[[scenario]]
id = "propose-accept"
code = "explore then the owner accepts a proposal (accept: 21% of later messages)"
variant = "committed"
turns = [
  {text = "ознакомься и предложи что тут стоит улучшить в первую очередь", expect = "answer_plan", oracle = ["test|web|веб|done|stats|json|server|автор|очеред"]},
  {text = "да давай, делай первое", expect = "plan_or_approve"},
]

[[scenario]]
id = "change-uncommitted"
code = "change on a project whose files are not committed (PenPot); the commit offer comes before the plan"
variant = "uncommitted"
turns = [
  {text = "добавь команду shelf stats: сколько книг прочитано и сколько в очереди", expect = "plan"},
]

[[scenario]]
id = "wait-question"
code = "a question while a plan waits must not approve it (REPORT ambiguous case S146)"
variant = "committed"
turns = [
  {text = "Add a --json flag to `shelf list` that prints the books as a JSON array; the default output stays the same.", expect = "plan"},
  {text = "перед тем как разрешить, хочу понять: что будет с обычным выводом list?", expect = "no_approve", oracle = ["list"]},
]

[[scenario]]
id = "wait-yes"
code = "a yes in words while a plan waits approves it (accept: 21% of later messages); manual, so no run starts"
variant = "committed"
level = "manual"
turns = [
  {text = "Add a --json flag to `shelf list` that prints the books as a JSON array; the default output stays the same.", expect = "plan"},
  {text = "да давай", expect = "approve"},
]

[[scenario]]
id = "change-auto"
code = "a change request at level auto: the first revision must wait for the owner's yes (design 3.3)"
variant = "committed"
level = "auto"
turns = [
  {text = "добавь команду shelf stats: сколько книг прочитано и сколько в очереди", expect = "plan"},
]
