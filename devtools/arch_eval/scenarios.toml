# Architect evaluation scenarios (A0 step 5; expectations per docs/designs/2026-11-04-a0-architect.md section 7).
# Each message is coded by the owner's intent, the taxonomy derived from his own messages (.local/a0, private).
#
# expect = "answer": no plan wanted (explore, question, status, "run it locally"); a plan call is an unwanted plan.
# expect = "answer_plan": an answer is required (oracle), a plan on the card is welcome.
# expect = "plan": a change request; a turn without a saved plan revision is a missed plan.
# expect = "plan_or_approve": a yes to the architect's proposal; a saved plan, or the approval of the plan it already
#   drafted with its answer (design 3.3), and neither is a missed plan.
# expect = "approve" / "no_approve": a message sent while a plan waits; it must, or must not, approve that plan.
# oracle: regexes (case-insensitive) every reply must match to count as an answer: facts only the fixture holds.
# followup = true: sent only when the turn before it did not answer; never in a denominator.
# variant: "committed" or "uncommitted" (an empty commit, the files untracked: the owner's PenPot).
# level (optional): the fixture profile's autonomy level, "supervised" by default.

[[scenario]]
id = "explore-run"
code = "explore + question (14 of 62 session openers)"
variant = "committed"
turns = [
  {text = "так можешь ознакомится с проектом и рассказать как его запустить локально?", expect = "answer", oracle = ["make dev|8731|python3 -m shelf"]},
  {text = "план не нужен, просто расскажи как его запустить", expect = "answer", oracle = ["make dev|8731|python3 -m shelf"], followup = true},
]

[[scenario]]
id = "pivot-uncommitted"
code = "explore + ambiguous goal; the PenPot message, verbatim in substance"
variant = "uncommitted"
turns = [
  {text = "ознакомься пожалуйста с проектом, там был пивот я снял с прода все хочу локально протестировать", expect = "answer", oracle = ["make dev|8731|python3 -m shelf|unittest"]},
  {text = "план пока не нужен, расскажи что в проекте и как его проверить локально", expect = "answer", oracle = ["make dev|8731|python3 -m shelf|unittest"], followup = true},
]

[[scenario]]
id = "pivot-committed"
code = "the PenPot message on a committed project: separates F18 from F17"
variant = "committed"
turns = [
  {text = "ознакомься пожалуйста с проектом, там был пивот я снял с прода все хочу локально протестировать", expect = "answer", oracle = ["make dev|8731|python3 -m shelf|unittest"]},
  {text = "план пока не нужен, расскажи что в проекте и как его проверить локально", expect = "answer", oracle = ["make dev|8731|python3 -m shelf|unittest"], followup = true},
]

[[scenario]]
id = "explore-plain"
code = "explore (7 of 62 openers)"
variant = "committed"
turns = [
  {text = "ознакомься детально с проектом пожалуйста", expect = "answer", oracle = ["books\\.json|8731|server/|shelf\\.cloud|PIVOT"]},
  {text = "что ты понял про проект? коротко", expect = "answer", oracle = ["books\\.json|8731|server/|shelf\\.cloud|PIVOT"], followup = true},
